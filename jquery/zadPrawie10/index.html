<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <style>
        #czerwony{
            background-color: rgb(33,33,33);
            width: 200px;
            height: 200px;
            position: absolute;
        }
        #zielen{
            background-color: green;
            width: 20px;
            height: 20px;
        }
    </style>
    <script>

        $(function(){
            let licznik = 0;
            
            $(".card").css({
                    "background-color": "rgb(" +  + ")",
                    "height": Math.floor((Math.random() * 150) + 100) + "px",
                    "width": Math.floor((Math.random() * 150) + 100) + "px"
                })
            

            $("#dodajKarte").click(function(){
                licznik++
                $("#licznik").text("dodano " + licznik +" divów")
                let wylosowane = Math.floor((Math.random() * 100) + 1)
                $("#content").append('<div class="card" style="background-color: rgb('+ Math.floor((Math.random() * 250) + 1) + ", " + Math.floor((Math.random() * 250) + 1) + ", "+ Math.floor((Math.random() * 250) + 1) +') ; height: '+ Math.floor((Math.random() * 150) + 100) + "px" +' ; width: '+ Math.floor((Math.random() * 150) + 100) + "px" +' ;" data-liczba="'+ wylosowane +'">'+ wylosowane +'</div>')
            })
            
            $("#UsunWszystkie").click(function(){
                licznik = 0
                $("#licznik").text("dodano " + licznik +" divów")

                $("#content").html("")
            })

        });
    </script>
</head>
<body>
    <button id="dodajKarte">Dodaj kartę</button>
    <button id="UsunWszystkie">Usuń kartę</button>
    
    <p id="licznik"> dodano 0 divów</p>
    
    <div id="content" >

    </div>

</body>
</html>
